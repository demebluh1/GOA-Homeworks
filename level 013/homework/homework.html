    <!-- Attributes — ეს არის დამატებითი ინფორმაცია, 
    რომელიც HTML თეგებს ემატება მათი ფუნქციონალის 
    ან ქცევის განსაზღვრისთვის. ანუ ისინი "ანიჭებენ" 
    თეგს დამატებით შესაძლებლობებს. -->


<!-- ქვემოთ ჩამოთვლილია ყველაზე ხშირად გამოყენებადი Attributes მათი დანიშნულებებით და მითითებით — optional არის თუ required -->

<!-- id — უნიკალური იდენტიფიკატორი ელემენტისთვის (optional) -->
<!-- href — ბმულის მისამართი <a> თეგში (required) -->
<!-- src — სურათის, ვიდეოს, სკრიპტის მისამართი <img>, <script>, <video>–ში (required) -->
<!-- alt — სურათის ტექსტური აღწერა <img>–ში (required) -->
<!-- title — tooltip ტექსტი, რომელიც მაუსის მიტანაზე ჩნდება (optional) -->
<!-- style — ელემენტის inline სტილის ჩაწერა (optional) -->
<!-- width — ელემენტის სიგრძე, ხშირად <img>, <video> (optional) -->
<!-- height — ელემენტის სიმაღლე (optional) -->
