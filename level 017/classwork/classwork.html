<html>
    <head>
            <title>Drop-down</title>
    </head>


    <body>
        <h1>Registration Form </h1>
        <label>Username:</label>
        <input required type="text">
        <br><br>
        <label>Password:</label>
        <input required type="password">
        <br><br>
        <label>City of Employment:</label>
        <input required type="text">
        <br><br>
        <label for="sel">Web server:</label>
        <select id="sel">
        <option selected>--Choose a server--</option> 
        <br><br>
        </select>
        <br><br>
        <label for="radio">Please Specify your role</label>
        <br>
        <label>Admin</label>
        <input  name="radio"  required type="radio">
        <br>
        <label>Engineer</label>
        <input  name="radio"  required type="radio">
        <br>
        <label>Manager</label>
        <input  name="radio" required type="radio">
        <br>
        <label>Guest</label>
        <input name="radio" required type="radio">
        <br><br>
        <label>Single Sign-on to the following:</label>
        <br>
        <label>Mail</label>
        <input type="checkbox">
        <br>
        <label>Payroll</label>
        <input type="checkbox">
        <br>
        <label>Self-service</label>
        <input type="checkbox">
    <br><br>
    <button>Login</button>
    <button>Reset</button>
    </body>
</html>
