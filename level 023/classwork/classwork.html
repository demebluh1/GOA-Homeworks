<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Attribute</title>
    </head>
        <body style="background-color: maroon;">
        <p style="color: rgb(235, 252, 0); text-align: center; font-size: medium; ">Hello, World!</p>
        <p style="color: blueviolet; text-align: right; font-size: xx-large;">Hello, World!</p>
        <p style="color: cyan; text-align: left; font-size: large;">Hello, World!</p>
        <p style="color: rgb(25, 218, 0); text-align: center; font-size: xx-small; ">Hello, World!</p>
        <p style="color: darkblue; text-align: start; font-size: xx-large; ">Hello, World!</p>
        </body>
</html
