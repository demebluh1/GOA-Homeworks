<!DOCTYPE html>
<html lang="ka">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- parent არის მთავარი კონტეინერი, რომელზეც ვიყენებთ grid-ს -->

        <div class="box">D</div>
        <div class="box">A</div>
        <div class="box">F</div>
        <div class="box">E</div>
        <div class="box">B</div>
        <div class="box">C</div>
    </div>

</body>
