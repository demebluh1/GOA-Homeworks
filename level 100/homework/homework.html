<!DOCTYPE html>

<body>

    <!-- 2) Image Slider -->

    <img id="slider" src="image1.jpg" width="400">

    <button id="next">Next</button>


    <!-- 3) Event Propagation -->
    <!--
    Event propagation არის პროცესი, როდესაც event-ი
    ერთი ელემენტიდან სხვა დაკავშირებულ ელემენტებზე გადადის.
    მისი ორი ძირითადი ფაზაა Capturing და Bubbling.
    -->


    <!-- 4) Bubbling და Capturing -->
    <!--
    Bubbling-ის დროს event მოძრაობს შიდა ელემენტიდან
    გარე ელემენტის მიმართულებით.

    Capturing-ის დროს event მოძრაობს გარე ელემენტიდან
    შიდა ელემენტის მიმართულებით.
    -->
