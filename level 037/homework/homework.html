<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- N1 -->
        <!-- Id selector ნიშნავს იდენტიფიცირებას და გამოიყენება იმისთვის რომ ტექსტს ან ნებისმიერ რამეს მივცეთ თავისი სახელი.
        ასევე id რომ გამოვიძახოთ css-ში უნდა გამოვიყენოთ # და მერე თვითონ id-ის სახელი.
        -->
        <!-- 
        class selector არის იგივე როგორც id selector, უბრალოდ განსხვავება ის არის რომ #-ის მაგივრად წერტილი უნდა დავწეროთ და
        მერე სახელი class-ის
        -->

        <!-- N2 -->
        <button class="Hello">Hello, World!</button>
        <button class="Hello">Hello, World!</button>
        <button class="Hello">Hello, World!</button>
        <button id="yo">Hello, World!</button>
        <button>Hello, World!</button>      

    </body>
</html>
